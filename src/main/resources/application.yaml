spring:
  application:
    name: watch-store-api

jwt:
  secret: ${JWT_SECRET}
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${URL_DB_LOCAL}
    username: ${USERNAME_DB_LOCAL}
    password: ${PASSWORD_DB_LOCAL}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    show-in-view: false


